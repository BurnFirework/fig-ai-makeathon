<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fcf6e9">
    <meta name="description" content="Unfold is a visual workspace for exploring ideas and finding a small next step.">
    <link rel="icon" href="../unfold/public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <title>Unfold — A space for what’s next</title>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <a class="brand" href="#">
          <img src="../unfold/public/favicon.svg" width="20" height="20" alt="">
          Unfold
        </a>
        <nav class="masthead-actions" aria-label="Get Unfold">
          <details>
            <summary class="download">Download <span aria-hidden="true">▾</span></summary>
            <ul class="download-options">
              <li><a href="https://unfold-downloads.bezr.dev/Unfold-0.1.1-arm64.dmg">Mac · Apple Silicon (.dmg)</a></li>
              <li><a href="https://unfold-downloads.bezr.dev/unfold_0.1.1_amd64.deb">Linux x64 · Debian / Ubuntu (.deb)</a></li>
              <li><a href="https://unfold-downloads.bezr.dev/Unfold-0.1.1-x86_64.AppImage">Linux x64 · AppImage</a></li>
            </ul>
          </details>
          <a class="masthead-link" href="/app/">Open app <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main>
      <section class="intro" aria-labelledby="title">
        <h1 id="title">Let your possibilities <em>unfold.</em></h1>
        <p>Bring your inspirations together, explore where they might lead, and find a small way forward.</p>
        <div class="hero-actions">
          <a class="try" href="/app/">Try in browser <span aria-hidden="true">↗</span></a>
          <a class="hero-download" href="https://unfold-downloads.bezr.dev/Unfold-0.1.1-arm64.dmg">Download for macOS</a>
        </div>
      </section>
      <img class="board" src="./board.webp" width="1440" height="1000" alt="An Unfold board with photo cards for live jazz and design work, connected to notes about each goal.">
    </main>
    <script type="module">
      const masthead = document.querySelector('.masthead');
      const updateBorder = () => masthead.classList.toggle('is-scrolled', window.scrollY > 12);
      window.addEventListener('scroll', updateBorder, { passive: true });
      updateBorder();
    </script>
  </body>
</html>
